# 로컬 개발 환경. 실행: 저장소 루트에서
#   docker compose --env-file .env -f infra/docker-compose.yml up --build
name: travel-copilot

services:
  nginx:
    image: nginx:1.30-alpine
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      backend:
        # 서버가 X-Forwarded-* 헤더를 믿는 유일한 주소 (server의 FORWARDED_ALLOW_IPS)
        ipv4_address: 172.30.0.10

  server:
    build: ../server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER 필요}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB 필요}
      FORWARDED_ALLOW_IPS: 172.30.0.10
    # 외부 포트 없음: Nginx를 거쳐서만 접근
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 필요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 필요}
    # 내 컴퓨터에서만 접속 가능 (같은 Wi-Fi의 다른 기기 차단). 테스트·DB 도구용
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # 파일 저장소(S3 호환)는 F7에서 추가한다. MinIO 공식 이미지 배포 중단으로 대체 도구를 F7 명세에서 결정.

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
