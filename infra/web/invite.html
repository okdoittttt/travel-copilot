<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Travel Copilot 초대</title>
<!--
  W01 초대 안내 (features/invites.md 5.8).
  JavaScript를 넣지 않는다: 주소의 # 뒤 초대 토큰을 읽거나 어디로도 보내지 않기 위해서다.
-->
<style>
  :root { color-scheme: light dark; --bg: #f5faf8; --fg: #1b1f1e; --muted: #5b6662; --card: #ffffff; --accent: #00695c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101413; --fg: #e3e8e6; --muted: #9aa5a1; --card: #1a201e; --accent: #4db6ac; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 28px 24px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { line-height: 1.6; color: var(--muted); margin: 0 0 12px; }
  ol { padding-left: 20px; line-height: 1.8; }
  .store { display: block; text-align: center; padding: 12px; border-radius: 10px; border: 1px solid var(--muted); color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>여행에 초대받았어요</h1>
    <p>Travel Copilot 앱에서 함께 일정을 볼 수 있어요.</p>
    <ol>
      <li>Travel Copilot 앱을 설치하세요.</li>
      <li>받은 초대 링크를 <strong>다시 눌러</strong> 앱에서 여세요.</li>
      <li>링크가 앱에서 열리지 않으면, 앱의 여행 목록 메뉴에서 <strong>초대 링크로 참여</strong>를 누르고 링크를 붙여넣으세요.</li>
    </ol>
    <span class="store">App Store · Google Play (출시 준비 중)</span>
  </div>
</main>
</body>
</html>
