worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 응답 헤더·에러 페이지에서 Nginx 버전 숨김
    server_tokens off;

    # 접근 로그: 쿼리 문자열이 빠진 $uri만 남긴다 (토큰이 쿼리에 실려 와도 기록되지 않게)
    log_format json_log escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /dev/stdout json_log;
    error_log /dev/stderr warn;

    # 기본 요청 크기 제한. 바우처 업로드 경로는 F7에서 따로 연다.
    client_max_body_size 1m;

    sendfile on;
    keepalive_timeout 30s;

    upstream api {
        server server:8000;
    }

    # HTTP는 전부 HTTPS로
    server {
        listen 80;
        listen [::]:80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/local.pem;
        ssl_certificate_key /etc/nginx/certs/local-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        # HSTS는 로컬에서 끈다 (localhost 전체에 걸려 다른 개발 작업에 영향). staging·production에서 켠다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # 앱이 보낸 값은 덮어쓴다: 요청 ID와 클라이언트 IP는 Nginx가 정한다
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }
}
