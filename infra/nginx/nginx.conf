worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 응답 헤더·에러 페이지에서 Nginx 버전 숨김
    server_tokens off;

    # 접근 로그: 쿼리 문자열이 빠진 $uri만 남긴다 (토큰이 쿼리에 실려 와도 기록되지 않게)
    log_format json_log escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /dev/stdout json_log;
    error_log /dev/stderr warn;

    # 기본 요청 크기 제한. 바우처 업로드 경로는 F7에서 따로 연다.
    client_max_body_size 1m;

    sendfile on;
    keepalive_timeout 30s;

    upstream api {
        server server:8000;
    }

    # HTTP는 전부 HTTPS로
    server {
        listen 80;
        listen [::]:80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/local.pem;
        ssl_certificate_key /etc/nginx/certs/local-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        # HSTS는 로컬에서 끈다 (localhost 전체에 걸려 다른 개발 작업에 영향). staging·production에서 켠다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # 앱이 보낸 값은 덮어쓴다: 요청 ID와 클라이언트 IP는 Nginx가 정한다
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # 서버도 Cache-Control을 붙이므로 서버 값은 숨기고 위 add_header 하나만 내보낸다
            # (Nginx가 직접 만드는 502 등에도 붙어야 해서 Nginx 쪽을 남긴다)
            proxy_hide_header Cache-Control;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # --- 초대 링크 (features/invites.md 5.8) ---
        # location 안에 add_header를 쓰면 server의 add_header가 상속되지 않으므로 다시 적는다.
        # W01은 JavaScript가 없어서 # 뒤 토큰을 읽지 않는다. CSP로 스크립트 실행 자체를 막는다.
        location = /invite {
            root /etc/nginx/web;
            try_files /invite.html =404;
            default_type "text/html; charset=utf-8";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        }

        # Universal Links·App Links 확인 파일: 리다이렉트 없이 application/json으로
        location = /.well-known/apple-app-site-association {
            root /etc/nginx/web;
            try_files /apple-app-site-association =404;
            default_type application/json;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /.well-known/assetlinks.json {
            root /etc/nginx/web;
            try_files /assetlinks.json =404;
            default_type application/json;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            return 404;
        }
    }
}
