name: server

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: travel_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d travel_copilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://travel:ci-only-password@localhost:5432/travel_copilot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: server

      - name: 의존성 설치
        run: uv sync --frozen

      - name: lint
        run: uv run ruff check .

      - name: 포맷 확인
        run: uv run ruff format --check .

      - name: 타입 검사
        run: uv run mypy

      - name: 테스트
        run: uv run pytest

      - name: 마이그레이션 적용 확인
        env:
          ENV: local
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic upgrade head
